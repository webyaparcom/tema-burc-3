<style>
  /* deger-burc-cark — deger-yorunge merkez başlık çevresinde sabit yerleşimdir, deger-sekme/deger-cip-sec düğme şeridiyle panel değiştirir; bu modülde seçici çarkın kendisidir — dönme açısıyla seçim yapılır, ibre + dilimli konik zemin iskeleti ailede tek. */
  .modulex-deger-burc-cark { box-sizing: border-box; width: 100%; padding: --bosluk-- 20px; background: --bg--; color: --text--; font-size: 1rem; line-height: 1.6; font-family: var(--mx-font-sans, inherit); overflow-wrap: break-word; }
  .modulex-deger-burc-cark *, .modulex-deger-burc-cark *::before, .modulex-deger-burc-cark *::after { box-sizing: border-box; }
  /* ham/css.css «* { font-size: 14px }» kalıtımı keser — modül içinde boyut üstten gelsin (ikon yazı tipi hariç) */
  .modulex-deger-burc-cark :where(*:not(.material-symbols-outlined)) { font-size: inherit; }
  /* aynı «*» kuralı font-weight 400 · line-height 1.2 · font-family de basar — modül içinde kalıtım */
  .modulex-deger-burc-cark :where(*:not(.material-symbols-outlined)) { font-weight: inherit; line-height: inherit; font-family: inherit; }
  .modulex-deger-burc-cark :where(h2, h3, h4, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; }
  .modulex-deger-burc-cark :where(ul, ol) { padding: 0; list-style: none; }

  .modulex-deger-burc-cark :where(a, button, summary, [data-cevir]) { cursor: pointer; }

  .modulex-deger-burc-cark-metin { color: --muted--; font-size: 1.05rem; line-height: 1.7; }
  .modulex-deger-burc-cark-bas { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px 48px; align-items: end; }
  .modulex-deger-burc-cark-ust { grid-column: 1 / -1; }
  .modulex-deger-burc-cark-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-block-start: 8px; }
  .modulex-deger-burc-cark-dugme { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 12px 22px; border: 2px solid --accent--; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease; }
  .modulex-deger-burc-cark-dugme:hover { transform: translateY(-2px); }
  .modulex-deger-burc-cark-dugme--ikincil { background: transparent; color: --text--; border-color: --cizgi--; }
  .modulex-deger-burc-cark-dugme--ikincil:hover { border-color: --accent--; }
  .modulex-deger-burc-cark-dugme .material-symbols-outlined { font-size: 20px; }

  .modulex-deger-burc-cark-duzen { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: clamp(28px, 5vw, 72px); align-items: center; --cap: min(80vw, 440px); }
  .modulex-deger-burc-cark-sahne { position: relative; justify-self: center; width: var(--cap); aspect-ratio: 1; padding-block-start: 0; }
  .modulex-deger-burc-cark-cark { position: relative; width: 100%; height: 100%; border-radius: 50%; background: repeating-conic-gradient(from calc(-180deg / var(--n)), --kartBg-- 0 calc(360deg / var(--n)), color-mix(in srgb, --accent-- 14%, --kartBg--) 0 calc(720deg / var(--n))); box-shadow: inset 0 0 0 10px color-mix(in srgb, --accent-- 30%, --kartBg--), 0 30px 50px -36px color-mix(in srgb, --text-- 70%, transparent); transform: rotate(calc(var(--aci, 0) * -1deg)); transition: transform 0.9s cubic-bezier(0.25, 1, 0.4, 1); }
  .modulex-deger-burc-cark-dilim { position: absolute; inset: 0; width: 112px; height: 112px; margin: auto; padding: 0; border: 0; border-radius: 50%; background: transparent; color: --text--; font: inherit; transform: rotate(calc(var(--i) * 360deg / var(--n))) translateY(calc(var(--cap) * -0.31)); }
  .modulex-deger-burc-cark-dic { display: grid; justify-items: center; gap: 4px; transform: rotate(calc(var(--aci, 0) * 1deg - var(--i) * 360deg / var(--n))); transition: transform 0.9s cubic-bezier(0.25, 1, 0.4, 1), scale 0.3s ease; }
  .modulex-deger-burc-cark-dilim:hover .modulex-deger-burc-cark-dic { scale: 1.08; }
  .modulex-deger-burc-cark-dilim[aria-pressed="true"] { color: --accentInk--; }
  .modulex-deger-burc-cark-dikon { display: inline-grid; place-items: center; width: 46px; height: 46px; border-radius: 50%; background: --bg--; font-size: 24px; transition: background 0.3s ease, color 0.3s ease; }
  .modulex-deger-burc-cark-dilim[aria-pressed="true"] .modulex-deger-burc-cark-dikon { background: --accent--; color: --accentText--; }
  .modulex-deger-burc-cark-dad { max-width: 108px; font-size: 0.82rem; font-weight: 750; line-height: 1.2; }
  .modulex-deger-burc-cark-gobek { position: absolute; inset: 37%; border: 6px solid --bg--; border-radius: 50%; background: radial-gradient(circle, --accent-- 0 22%, color-mix(in srgb, --accent-- 20%, --kartBg--) 23%); }
  .modulex-deger-burc-cark-ibre { position: absolute; inset-block-start: -16px; inset-inline: 0; width: 0; height: 0; margin-inline: auto; border-inline: 14px solid transparent; border-block-start: 24px solid --text--; filter: drop-shadow(0 4px 4px color-mix(in srgb, --text-- 40%, transparent)); }
  .modulex-deger-burc-cark-yan { display: grid; gap: 22px; }
  .modulex-deger-burc-cark-panel { display: grid; gap: 22px; }
  .modulex-deger-burc-cark-oge { position: relative; display: grid; gap: 10px; padding: clamp(22px, 3vw, 34px); border-inline-start: 4px solid --accent--; border-start-end-radius: --yuvarlak--; border-end-end-radius: --yuvarlak--; background: --bg--; animation: modulex-deger-burc-cark-gir 0.5s ease both; }
  .modulex-deger-burc-cark-kno { color: --muted--; font-family: var(--mx-font-mono, ui-monospace, monospace); font-size: 0.85rem; letter-spacing: 0.08em; }
  .modulex-deger-burc-cark-ikon { justify-self: start; color: --accentInk--; font-size: 40px; }
  .modulex-deger-burc-cark-etiket { color: --accentInk--; font-size: 0.78rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; }
  .modulex-deger-burc-cark-kbaslik { font-size: clamp(1.5rem, 2.6vw, 2.1rem); font-weight: 800; line-height: 1.15; }
  .modulex-deger-burc-cark-kmetin { color: --muted--; font-size: 1.04rem; line-height: 1.75; }
  .modulex-deger-burc-cark-kontrol { display: none; gap: 12px; }
  .modulex-deger-burc-cark--js .modulex-deger-burc-cark-kontrol { display: flex; }
  .modulex-deger-burc-cark-yon { display: inline-grid; place-items: center; width: 50px; height: 50px; border: 1px solid --cizgi--; border-radius: 50%; background: --bg--; color: --text--; transition: background 0.25s ease, color 0.25s ease, border-color 0.25s ease; }
  .modulex-deger-burc-cark-yon:hover { border-color: --accent--; background: --accent--; color: --accentText--; }
  @keyframes modulex-deger-burc-cark-gir { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @media (max-width: 768px) {
    .modulex-deger-burc-cark-duzen { grid-template-columns: minmax(0, 1fr); --cap: min(86vw, 340px); }
    .modulex-deger-burc-cark-dilim { width: 92px; height: 92px; }
    .modulex-deger-burc-cark-dikon { width: 38px; height: 38px; font-size: 20px; }
    .modulex-deger-burc-cark-dad { max-width: 90px; font-size: 0.74rem; }
  }
  .modulex-deger-burc-cark-bag { color: inherit; text-decoration: none; }
  .modulex-deger-burc-cark-bag::after { content: ""; position: absolute; inset: 0; z-index: 3; }
  .modulex-deger-burc-cark-bag:hover { text-decoration: underline; text-underline-offset: 4px; }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-deger-burc-cark :is(.modulex-deger-burc-cark-baslik, .modulex-deger-burc-cark-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-deger-burc-cark-baslik { line-height: 1.35; }
  @media (max-width: 1024px) {
    .modulex-deger-burc-cark-bas { grid-template-columns: minmax(0, 1fr); }
  }
  @media (max-width: 768px) {
    .modulex-deger-burc-cark { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-deger-burc-cark *, .modulex-deger-burc-cark *::before, .modulex-deger-burc-cark *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-deger-burc-cark";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const cark = (s, P) => {
        const c = s.querySelector("[data-cark]");
        const d = [...s.querySelectorAll("[data-cark-git]")];
        const p = [...s.querySelectorAll("[data-cark-panel]")];
        if (!c || d.length < 2) return;
        s.classList.add(P + "--js");
        const n = d.length;
        let i = 0;
        let tur = 0;
        const git = (j) => {
          j = ((j % n) + n) % n;
          let f = j - i;
          if (f > n / 2) f -= n;
          if (f < -n / 2) f += n;
          tur += f;
          i = j;
          c.style.setProperty("--aci", String((tur * 360) / n));
          d.forEach((b, x) => b.setAttribute("aria-pressed", String(x === i)));
          p.forEach((x, y) => { x.hidden = y !== i; });
        };
        d.forEach((b) => b.addEventListener("click", () => git(Number(b.dataset.carkGit) || 0)));
        s.querySelectorAll("[data-cark-yon]").forEach((b) => b.addEventListener("click", () => git(i + (b.dataset.carkYon === "ileri" ? 1 : -1))));
        git(0);
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      cark(s, P, az);
    });
  })();
</script>
