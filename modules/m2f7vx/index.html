<section class="modulex-burc-izgara{{fbsinif}}" {{fbetiket}}>
  <div class="modulex-burc-izgara-ic">
    {{fbbas}}
    {{fbgovde}}
  </div>
</section>

<style>
  /* burc-izgara — tanitim-mozaik'in durağan bento karolarından farkı: karolar seçilebilir ve seçilenin içeriği ızgaranın ortasındaki 2×2 panele taşınır (halka düzeni); tanitim-daire-yorunge'nin yörüngedeki ikon rozetlerinden farklı olarak her burç tam karo + tarih/element bilgisi taşır. */
  .modulex-burc-izgara { box-sizing: border-box; width: 100%; padding: --bosluk-- 20px; background: --bg--; color: --text--; font-size: 1rem; line-height: 1.6; font-family: var(--mx-font-sans, inherit); overflow-wrap: break-word; }
  .modulex-burc-izgara *, .modulex-burc-izgara *::before, .modulex-burc-izgara *::after { box-sizing: border-box; }
  /* ham/css.css «* { font-size: 14px }» kalıtımı keser — modül içinde boyut üstten gelsin (ikon yazı tipi hariç) */
  .modulex-burc-izgara :where(*:not(.material-symbols-outlined)) { font-size: inherit; }
  /* aynı «*» kuralı font-weight 400 · line-height 1.2 · font-family de basar — modül içinde kalıtım */
  .modulex-burc-izgara :where(*:not(.material-symbols-outlined)) { font-weight: inherit; line-height: inherit; font-family: inherit; }
  .modulex-burc-izgara :where(h2, h3, h4, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; }
  .modulex-burc-izgara :where(ul, ol) { padding: 0; list-style: none; }
  .modulex-burc-izgara img { display: block; max-width: 100%; }
  /* <img width height> öznitelik yüksekliği CSS aspect-ratio'yu ezer — sıfır özgüllükle auto (modül sınıfının height'ı yine kazanır) */
  :where(.modulex-burc-izgara) img { height: auto; }
  .modulex-burc-izgara [hidden] { display: none !important; }
  .modulex-burc-izgara :where(a, button, summary, [data-cevir]) { cursor: pointer; }
  .modulex-burc-izgara :where(a, button, summary, [tabindex]):focus-visible { outline: 3px solid --accent--; outline-offset: 3px; }
  .modulex-burc-izgara-ic { max-width: --max--; margin-inline: auto; }
  .modulex-burc-izgara-bas { display: grid; gap: 12px; margin-block-end: clamp(32px, 4vw, 52px); }
  .modulex-burc-izgara--bassiz .modulex-burc-izgara-bas { display: none; }
  .modulex-burc-izgara-ust { color: --accentInk--; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
  .modulex-burc-izgara-baslik { font-family: var(--mx-font-heading, inherit); font-size: clamp(1.8rem, 3.4vw, 2.8rem); font-weight: 750; letter-spacing: -0.025em; line-height: 1.1; }
  .modulex-burc-izgara-metin { color: --muted--; font-size: 1.05rem; line-height: 1.7; }
  .modulex-burc-izgara-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-block-start: 8px; }
  .modulex-burc-izgara-dugme { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 12px 22px; border: 2px solid --accent--; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease; }
  .modulex-burc-izgara-dugme:hover { transform: translateY(-2px); }
  .modulex-burc-izgara-dugme--ikincil { background: transparent; color: --text--; border-color: --cizgi--; }
  .modulex-burc-izgara-dugme--ikincil:hover { border-color: --accent--; }
  .modulex-burc-izgara-dugme .material-symbols-outlined { font-size: 20px; }

  .modulex-burc-izgara-giris { display: grid; justify-items: center; gap: 14px; max-width: 720px; margin-inline: auto; margin-block-end: clamp(32px, 4vw, 52px); text-align: center; }
  .modulex-burc-izgara-burcler { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  .modulex-burc-izgara--js .modulex-burc-izgara-burcler--halka .modulex-burc-izgara-panel { grid-column: 2 / 4; grid-row: 2 / 4; }
  .modulex-burc-izgara-burc { position: relative; display: grid; border: 1px solid --cizgi--; border-radius: --yuvarlak--; background: --kartBg--; transition: transform 0.3s ease, border-color 0.3s ease, background 0.3s ease, color 0.3s ease; }
  .modulex-burc-izgara-burc:hover { transform: translateY(-3px); border-color: --accent--; }
  .modulex-burc-izgara-burc.modulex-burc-izgara--secili { border-color: --vurguBg--; background: --vurguBg--; color: --vurguText--; }
  .modulex-burc-izgara-bic { display: grid; justify-items: center; align-content: center; gap: 4px; min-height: 140px; padding: 18px 12px; text-align: center; }
  .modulex-burc-izgara-sembol { color: --accentInk--; font-size: 2.4rem; line-height: 1; transition: transform 0.4s ease; }
  .modulex-burc-izgara-burc:hover .modulex-burc-izgara-sembol { transform: rotate(-10deg) scale(1.1); }
  .modulex-burc-izgara-burc.modulex-burc-izgara--secili :is(.modulex-burc-izgara-sembol, .modulex-burc-izgara-btarih) { color: inherit; }
  .modulex-burc-izgara-bad { font-size: 1rem; font-weight: 750; }
  .modulex-burc-izgara-btarih { color: --muted--; font-size: 0.78rem; }
  .modulex-burc-izgara-boge { font-size: 0.72rem; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; }
  .modulex-burc-izgara-bmetin { margin-block-start: 6px; color: --muted--; font-size: 0.88rem; }
  .modulex-burc-izgara-bdevam { color: --accentInk--; font-weight: 700; }
  .modulex-burc-izgara--js .modulex-burc-izgara-burc :is(.modulex-burc-izgara-bmetin, .modulex-burc-izgara-bdevam, .modulex-burc-izgara-boge) { display: none; }
  .modulex-burc-izgara-bdug { position: absolute; inset: 0; width: 100%; padding: 0; border: 0; border-radius: inherit; background: transparent; }
  .modulex-burc-izgara-panel { position: relative; grid-column: 1 / -1; display: grid; align-content: center; justify-items: center; gap: 10px; padding: clamp(24px, 4vw, 44px); overflow: hidden; border: 2px solid --accent--; border-radius: calc(--yuvarlak-- * 1.3); background: --bg--; text-align: center; isolation: isolate; }
  .modulex-burc-izgara-panel::before { content: ""; position: absolute; inset: 8%; z-index: -1; border: 1px dashed color-mix(in srgb, --accent-- 45%, transparent); border-radius: 50%; animation: modulex-burc-izgara-don 60s linear infinite; }
  .modulex-burc-izgara-panel .modulex-burc-izgara-sembol { font-size: clamp(3.6rem, 7vw, 5.4rem); }
  .modulex-burc-izgara-panel .modulex-burc-izgara-bad { font-family: var(--mx-font-heading, inherit); font-size: clamp(1.6rem, 3vw, 2.2rem); }
  .modulex-burc-izgara-panel .modulex-burc-izgara-btarih { font-size: 0.95rem; }
  .modulex-burc-izgara-panel .modulex-burc-izgara-boge { padding: 4px 12px; border-radius: 999px; background: color-mix(in srgb, --accent-- 14%, transparent); color: --accentInk--; }
  .modulex-burc-izgara-panel .modulex-burc-izgara-bmetin { max-width: 46ch; color: --text--; font-size: 1rem; }
  .modulex-burc-izgara-panel.modulex-burc-izgara--tazele > * { animation: modulex-burc-izgara-belir 0.5s ease both; }
  .modulex-burc-izgara-alt { display: flex; justify-content: center; margin-block-start: 32px; }
  @keyframes modulex-burc-izgara-don { to { transform: rotate(360deg); } }
  @keyframes modulex-burc-izgara-belir { from { opacity: 0; transform: translateY(8px) scale(0.98); } to { opacity: 1; transform: none; } }
  @media (max-width: 1024px) {
    .modulex-burc-izgara-burcler { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .modulex-burc-izgara--js .modulex-burc-izgara-burcler--halka .modulex-burc-izgara-panel { grid-column: 1 / -1; grid-row: auto; }
    .modulex-burc-izgara-panel { order: -1; }
  }
  @media (max-width: 768px) {
    .modulex-burc-izgara-burcler { gap: 8px; }
    .modulex-burc-izgara-bic { min-height: 108px; padding: 14px 6px; }
    .modulex-burc-izgara-sembol { font-size: 1.9rem; }
    .modulex-burc-izgara-bad { font-size: 0.9rem; }
  }
  .modulex-burc-izgara-bag { color: inherit; text-decoration: none; }
  .modulex-burc-izgara-bag:hover { text-decoration: underline; text-underline-offset: 4px; }
  .modulex-burc-izgara-mbaslik { font-size: 1.05rem; font-weight: 700; }
  .modulex-burc-izgara-mmetin { color: --muted--; font-size: 0.95rem; }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-burc-izgara :is(.modulex-burc-izgara-baslik, .modulex-burc-izgara-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-burc-izgara-baslik { line-height: 1.35; }
  @media (max-width: 768px) {
    .modulex-burc-izgara { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-burc-izgara *, .modulex-burc-izgara *::before, .modulex-burc-izgara *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-burc-izgara";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const burcSec = (s, P) => {
        const bt = [...s.querySelectorAll("[data-bsec]")];
        const pn = s.querySelector("[data-bpanel]");
        if (!bt.length || !pn) return;
        s.classList.add(P + "--js");
        const sec = (i) => {
          const kay = bt[i].closest("[data-burc]");
          bt.forEach((b, j) => b.setAttribute("aria-pressed", String(j === i)));
          s.querySelectorAll("[data-burc]").forEach((z) => z.classList.toggle(P + "--secili", z === kay));
          const bic = kay && kay.querySelector("[data-bic]");
          pn.replaceChildren(...(bic ? [...bic.children].map((c) => c.cloneNode(true)) : []));
          pn.hidden = false;
          pn.classList.remove(P + "--tazele");
          void pn.offsetWidth;
          pn.classList.add(P + "--tazele");
        };
        bt.forEach((b, i) => { b.hidden = false; b.addEventListener("click", () => sec(i)); });
        sec(0);
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      burcSec(s, P, az);
    });
  })();
</script>
